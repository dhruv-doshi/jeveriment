[project]
name = "jev-rag-eval"
version = "0.1.0"
description = "Replayable, pluggable RAG evaluation of Jev reranking"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.28", "pydantic>=2.10", "python-dotenv>=1.0", "pyyaml>=6.0", "numpy>=2.0"]

[project.optional-dependencies]
local = ["torch>=2.6", "transformers>=4.51,<5", "sentence-transformers>=4,<6", "huggingface-hub>=0.30", "pyarrow>=19", "faiss-cpu>=1.10"]
service = ["fastapi>=0.115", "uvicorn>=0.30"]
load = ["locust>=2.31"]
observability = ["opentelemetry-api>=1.30", "opentelemetry-sdk>=1.30", "pyarrow>=19"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_eval"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
