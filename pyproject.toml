[project]
name = "jev-rag-eval"
version = "0.1.0"
description = "Reproducible fixed-pool retrieval evaluation for Jev via Vercel"
requires-python = ">=3.11,<3.13"
dependencies = ["httpx>=0.28", "pydantic>=2.10", "python-dotenv>=1.0", "pyyaml>=6.0", "numpy>=2.0", "scipy>=1.14", "ir-measures>=0.3", "psutil>=6.0"]

[project.optional-dependencies]
local = ["bm25s>=0.2", "PyStemmer>=2.2", "torch>=2.6", "transformers>=4.51,<5", "sentence-transformers>=4,<6", "huggingface-hub>=0.30", "pyarrow>=19", "scikit-learn>=1.6", "matplotlib>=3.9"]

[dependency-groups]
dev = ["pytest>=8.0", "ruff>=0.12"]

[project.scripts]
jev-eval = "jev_eval.cli:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.hatch.build.targets.wheel]
packages = ["src/jev_eval"]

[tool.ruff]
target-version = "py311"

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I"]
